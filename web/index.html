<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ablony">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ablony">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ablony</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps (sélection de localisation). Une clé API web y est
       toujours visible côté client (protection via restriction par référent
       HTTP dans Google Cloud Console, pas par secret) — remplace le
       placeholder ci-dessous par ta vraie clé restreinte au domaine web,
       puis relance `flutter build web --release` + redeploy. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYwEUMV9Fm-epx2HZg4mC37yfDSofJqxI" async defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- ============================================================
       AIDE À L'INSTALLATION (PWA)
       ============================================================
       Écrit ici, en JavaScript simple, plutôt que dans l'application
       Flutter : cela s'affiche **avant** que Flutter ne démarre, ne
       demande aucune release mobile, et reste modifiable par un simple
       redéploiement web.

       Deux chemins, parce que les plateformes ne se valent pas :

       - Android/Chrome expose `beforeinstallprompt`. On l'intercepte
         pour proposer l'installation au bon moment, avec notre propre
         bouton, au lieu de la bannière grise du navigateur que tout le
         monde ignore.

       - iOS n'expose **rien**. Apple ne permet pas de déclencher
         l'installation par du code. La seule voie est Partager → « Sur
         l'écran d'accueil ». On ne peut donc que l'expliquer — mais
         l'expliquer au moment exact où la personne veut installer vaut
         infiniment mieux que de la laisser chercher.

       `?install=1` ouvre l'aide immédiatement : c'est ce que vise le
       bouton du site vitrine, qui ne peut pas installer lui-même
       (l'invite appartient à l'origine de l'application).
       ============================================================ -->
  <style>
    .abl-inst{position:fixed;left:0;right:0;bottom:0;z-index:9999;
      background:#fff;color:#111;font-family:system-ui,-apple-system,sans-serif;
      box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:18px 18px calc(18px + env(safe-area-inset-bottom));
      transform:translateY(110%);transition:transform .28s ease;border-radius:18px 18px 0 0}
    .abl-inst.on{transform:translateY(0)}
    .abl-inst h3{margin:0 0 6px;font-size:17px}
    .abl-inst p{margin:0 0 14px;font-size:14px;line-height:1.45;color:#444}
    .abl-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .abl-row img{width:44px;height:44px;border-radius:10px;flex:none}
    .abl-btn{display:block;width:100%;background:#2385AE;color:#fff;border:0;
      border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer}
    .abl-close{background:none;border:0;color:#777;font-size:14px;padding:10px;
      width:100%;cursor:pointer;margin-top:4px}
    .abl-steps{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.7;color:#333}
    .abl-steps b{color:#2385AE}
    @media(prefers-color-scheme:dark){
      .abl-inst{background:#1e1e1e;color:#fff}
      .abl-inst p{color:#bbb}.abl-steps{color:#ddd}
    }
  </style>
  <div class="abl-inst" id="ablInst" role="dialog" aria-label="Installer Ablony"></div>
  <!-- NETTOYAGE DES SERVICE WORKERS — une seule fois par appareil.
       Des essais d'intégration des notifications push ont pu laisser un
       service worker enregistré sur cette origine. Un service worker survit
       aux déploiements : tant qu'il n'est pas retiré, il continue de
       s'interposer, et aucune mise en ligne ne le corrige.

       **Une seule fois**, et c'est important : laissé à chaque chargement,
       ce bloc interdirait pour toujours la moindre mise en cache par un
       service worker. Le nettoyage d'un incident ne doit pas devenir une
       règle permanente.

       Il ne recharge pas la page : un désenregistrement ne l'exige pas, et
       en provoquer un ici créerait une boucle. -->
  <script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    try {
      if (localStorage.getItem('ablSwNettoye') === '1') return;
      localStorage.setItem('ablSwNettoye', '1');
    } catch (e) {
      // Stockage indisponible (navigation privée) : on nettoie quand même,
      // ce qui ne coûte qu'un appel sans réseau.
    }
    navigator.serviceWorker.getRegistrations().then(function (liste) {
      liste.forEach(function (r) {
        r.unregister().catch(function () {});
      });
    }).catch(function () {});
  })();
  </script>

  <script>
  (function () {
    var boite = document.getElementById('ablInst');
    var invite = null;             // l'événement Chrome, s'il arrive
    var forcee = location.search.indexOf('install=1') !== -1;

    // Déjà installée : ne jamais importuner quelqu'un qui a fait le geste.
    var posee = window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
    if (posee) return;

    var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    // Sur iOS, seul Safari pose une icône de façon fiable : le geste expliqué
    // dans Chrome ou Firefox iOS ne mène pas au même menu.
    var safariIOS = iOS && !/crios|fxios|edgios|opt\//i.test(navigator.userAgent);
    // Mais ne rien afficher du tout dans ces navigateurs-là laissait quelqu'un
    // venu exprès pour installer devant une page muette — après avoir touché
    // un bouton « Installer sur iPhone ». On lui dit où aller.
    var autreNavigateurIOS = iOS && !safariIOS;

    function montrer(html) {
      boite.innerHTML = html;
      requestAnimationFrame(function () { boite.classList.add('on'); });
      var f = boite.querySelector('[data-fermer]');
      if (f) f.onclick = function () {
        boite.classList.remove('on');
        try { localStorage.setItem('ablInstVu', String(Date.now())); } catch (e) {}
      };
    }

    var entete =
      '<div class="abl-row">' +
      '<img src="icons/Icon-192.png" alt="">' +
      '<div><h3>Installer Ablony</h3>' +
      '<p style="margin:0">Accès direct depuis votre écran d\'accueil, sans passer par le navigateur.</p></div></div>';

    function proposerAndroid() {
      montrer(entete +
        '<button class="abl-btn" data-installer>Installer l\'application</button>' +
        '<button class="abl-close" data-fermer>Plus tard</button>');
      boite.querySelector('[data-installer]').onclick = function () {
        if (!invite) return;
        invite.prompt();
        invite.userChoice.then(function () {
          invite = null;
          boite.classList.remove('on');
        });
      };
    }

    function guiderIOS() {
      montrer(entete +
        '<ol class="abl-steps">' +
        '<li>Touchez <b>Partager</b> en bas de l\'écran</li>' +
        '<li>Faites défiler et choisissez <b>Sur l\'écran d\'accueil</b></li>' +
        '<li>Touchez <b>Ajouter</b></li>' +
        '</ol>' +
        '<button class="abl-close" data-fermer>J\'ai compris</button>');
    }

    // Chrome/Edge/Android : on garde l'invite pour la rejouer nous-mêmes.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      invite = e;
      if (forcee) proposerAndroid();
      else setTimeout(proposerAndroid, 2500); // laisser la page s'afficher d'abord
    });

    function orienterVersSafari() {
      montrer(entete +
        '<p>Sur iPhone, seul <b>Safari</b> sait poser une icône sur l\'écran ' +
        'd\'accueil. Ouvrez cette page dans Safari, puis Partager › ' +
        '<b>Sur l\'écran d\'accueil</b>.</p>' +
        '<button class="abl-btn" data-copier>Copier le lien</button>' +
        '<button class="abl-close" data-fermer>Continuer ici</button>');
      var b = boite.querySelector('[data-copier]');
      b.onclick = function () {
        var lien = location.origin + '/?install=1';
        var fini = function () { b.textContent = 'Lien copié'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(lien).then(fini, function () {});
        } else {
          // Sans presse-papiers (contexte non sécurisé, vieux Safari), on
          // affiche le lien : il reste sélectionnable à la main.
          b.textContent = lien;
        }
      };
    }

    if (autreNavigateurIOS) {
      var vuAutre = 0;
      try { vuAutre = Number(localStorage.getItem('ablInstVu') || 0); } catch (e) {}
      if (forcee || Date.now() - vuAutre >= 7 * 24 * 3600 * 1000) {
        setTimeout(orienterVersSafari, forcee ? 400 : 3000);
      }
    }

    if (safariIOS) {
      // Pas d'événement sur iOS : on décide nous-mêmes du moment.
      var vu = 0;
      try { vu = Number(localStorage.getItem('ablInstVu') || 0); } catch (e) {}
      var recent = Date.now() - vu < 7 * 24 * 3600 * 1000;
      if (forcee || !recent) setTimeout(guiderIOS, forcee ? 400 : 3000);
    }
  })();
  </script>
</body>
</html>
